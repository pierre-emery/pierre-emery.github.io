<script>try{ const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; }catch(e){}</script>
<style>
  :root{
    --paper:#f3efe6; --ink:#25211c; --muted:#7d7366;
    --contour:#a0703f; --contour-index:#7c5228;
    --water:#d3e4ea; --water-line:#5b8fab;
    --shadow:#3a2f24; --highlight:#ffffff;
    --trail:#d1262b; --panel:#fbf8f2; --line:#d9d1c3;
    color-scheme: light;
    --font: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#16181b; --ink:#ebe6dc; --muted:#948a7c;
      --contour:#6f5842; --contour-index:#a7835c;
      --water:#15232b; --water-line:#4f87a6;
      --shadow:#000000; --highlight:#4a443c;
      --trail:#ff5a5f; --panel:#1d2024; --line:#33373c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#16181b; --ink:#ebe6dc; --muted:#948a7c;
    --contour:#6f5842; --contour-index:#a7835c;
    --water:#15232b; --water-line:#4f87a6;
    --shadow:#000000; --highlight:#4a443c;
    --trail:#ff5a5f; --panel:#1d2024; --line:#33373c;
    color-scheme: dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:64px}
  body{background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;text-decoration-thickness:1px}
  a:hover{text-decoration-color:var(--ink)}
  .kicker{font-family:var(--font);font-size:12.5px;color:var(--muted)}
  .wrap{max-width:1080px;margin:0 auto;padding:0 28px}
  .wrap.wide{max-width:1320px}
  .btn{font:inherit;font-family:var(--font);font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:7px 11px;cursor:pointer;border-radius:2px;transition:border-color .2s;text-decoration:none;display:inline-block}
  .btn:hover,.btn:focus-visible{border-color:var(--ink);outline:none}
  .btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* ---------- top bar ---------- */
  .bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar .wrap{display:flex;justify-content:space-between;align-items:center;gap:14px;height:54px}

  /* ---------- hero ---------- */
  .hero{position:relative;overflow:hidden;min-height:calc(100vh - 55px);min-height:calc(100svh - 55px);display:flex;align-items:center;border-bottom:1px solid var(--line)}
  #topo{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hero::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,var(--paper) 0%,color-mix(in srgb,var(--paper) 85%,transparent) 40%,transparent 80%)}
  .hero .wrap{position:relative;z-index:1;width:100%;padding-top:56px;padding-bottom:96px}
  .hero h1{font-size:clamp(40px,6.2vw,66px);font-weight:600;letter-spacing:-.03em;line-height:1.02}
  .hero .intro{font-size:17px;line-height:1.65;margin-top:18px;max-width:600px}
  .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
  .cta .btn{font-size:13px;padding:9px 14px}
  .now{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:30px;max-width:600px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .now .what{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:baseline;min-width:0}
  .now b{font-weight:500;font-size:14.5px}
  .now i{display:block;font-style:normal;font-family:var(--font);font-size:12.5px;color:var(--muted);margin-top:2px}
  .now .go{white-space:nowrap;font-family:var(--font);font-size:13px;text-decoration:none;color:var(--ink)}
  .now .go:hover{color:var(--trail)}
  .down{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:1;width:40px;height:40px;display:grid;place-items:center;
    border:1px solid var(--line);border-radius:50%;background:color-mix(in srgb,var(--panel) 80%,transparent);color:var(--ink);text-decoration:none;font-size:16px;
    animation:bob 2.4s ease-in-out infinite}
  .down:hover{border-color:var(--ink)}
  .newt{position:absolute;right:24px;bottom:22px;z-index:1}
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,5px)}}
  #trail .arw{fill:none;stroke:var(--trail);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.75}

  /* ---------- sections ---------- */
  .sec{padding-top:76px}
  .sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .sec-h h2{font-size:28px;font-weight:600;letter-spacing:-.02em;margin-top:6px}
  .sec-h p{font-size:14px;line-height:1.55;color:var(--muted);max-width:560px;margin-top:6px}
  .ctrl{display:flex;gap:8px;align-items:center}
  .seed{font-family:var(--font);font-size:12.5px;color:var(--muted);margin-right:4px}

  /* ---------- map ---------- */
  .mapbox{position:relative;height:clamp(460px,74vh,760px);margin-top:18px;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:var(--paper)}
  #map{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .6s ease}
  #map.on{opacity:1}
  #trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .8s ease .3s}
  #trail.on{opacity:1}
  #trail path{fill:none;stroke:var(--trail);stroke-width:1.6;stroke-dasharray:5 5;stroke-linecap:round}
  #peaks{position:absolute;inset:0;pointer-events:none}

  .peak{position:absolute;pointer-events:auto;background:none;border:0;cursor:pointer;color:var(--ink);font:inherit;transform:translate(-7px,-8px);animation:pop .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
  .peak svg{display:block;width:14px;height:12px;transition:transform .2s ease}
  .peak svg path{fill:var(--ink);transition:fill .2s}
  .peak .lbl{position:absolute;left:19px;top:-4px;white-space:nowrap;text-align:left;
    text-shadow:0 0 2px var(--paper),0 0 4px var(--paper),0 0 7px var(--paper),0 0 10px var(--paper)}
  .peak.flip .lbl{left:auto;right:19px;text-align:right}
  .lbl b{display:block;font-weight:600;font-size:13px;letter-spacing:.005em}
  .lbl i{display:block;font-style:normal;font-family:var(--font);font-size:12.5px;color:var(--muted);margin-top:1px}
  .peak:hover svg,.peak:focus-visible svg,.peak.active svg,.peak.hot svg{transform:scale(1.4)}
  .peak.wip svg path{fill:var(--paper);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
  .peak:hover svg path,.peak:focus-visible svg path,.peak.active svg path,.peak.hot svg path{fill:var(--trail);stroke:var(--trail)}
  .peak:focus-visible{outline:none}
  .peak:focus-visible .lbl b{text-decoration:underline;text-underline-offset:3px}
  @keyframes pop{from{opacity:0;transform:translate(-7px,0)}to{opacity:1;transform:translate(-7px,-8px)}}

  .mleg{position:absolute;left:12px;bottom:12px;z-index:2;display:grid;gap:5px;padding:9px 11px;border:1px solid var(--line);border-radius:2px;
    background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:var(--font);font-size:12.5px;color:var(--muted)}
  .mleg span{display:flex;align-items:center;gap:8px}
  .sw-tri{width:10px;height:9px;background:var(--ink);clip-path:polygon(50% 0,100% 100%,0 100%)}
  .sw-trail{width:18px;border-top:1.6px dashed var(--trail)}
  .scale{margin-top:3px}
  .scale .bar{width:100px;height:5px;border:1px solid var(--ink);background:linear-gradient(90deg,var(--ink) 50%,transparent 50%);margin:3px 0 0}
  .scale .ticks{display:flex;justify-content:space-between;width:100px}
  .readout{position:absolute;right:12px;bottom:12px;z-index:2;font-family:var(--font);font-size:12.5px;color:var(--muted);
    text-shadow:0 0 4px var(--paper),0 0 8px var(--paper)}


  /* ---------- project panel ---------- */
  .panel{position:fixed;top:0;right:0;height:100%;width:min(740px,100%);background:var(--panel);border-left:1px solid var(--line);
    transform:translateX(102%);transition:transform .4s cubic-bezier(.2,.7,.2,1);padding:26px 28px 34px;overflow-y:auto;z-index:30}
  .panel.open{transform:none;box-shadow:-20px 0 60px rgba(0,0,0,.08)}
  .panel .close{position:absolute;top:16px;right:16px;font-size:13px;padding:6px 10px}
  .md{max-width:640px}
  .md h2{font-size:27px;font-weight:600;line-height:1.2;letter-spacing:-.015em;margin-top:28px;padding-right:50px}
  .md .meta{font-size:13.5px;color:var(--muted);margin-top:6px}
  .md h3{font-size:17px;font-weight:600;margin-top:28px}
  .md p{font-size:15.5px;line-height:1.7;margin-top:9px}
  .md ul{margin:9px 0 0 20px;font-size:15.5px;line-height:1.7}
  .md figure{margin-top:20px}
  .md figure img{display:block;max-width:100%;max-height:440px;width:auto;height:auto;border-radius:2px;cursor:zoom-in}
  .md figcaption{font-size:13px;line-height:1.5;color:var(--muted);margin-top:6px;font-style:italic}
  .md .repo{margin-top:34px;padding-top:22px;border-top:1px solid var(--line);text-align:center}
  .md .repo p{font-size:14.5px;color:var(--muted);margin:0 0 12px}
  .md .repo div{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .md .repo .btn{font-size:14px;padding:9px 16px}

  /* ---------- outside ---------- */
  .ints{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:18px}
  .int{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:16px 18px 18px}
  .int img{display:block;width:calc(100% + 36px);margin:-16px -18px 14px;aspect-ratio:3/2;object-fit:cover;border-bottom:1px solid var(--line)}
  .int h3{font-size:16.5px;font-weight:600}
  .int p{font-size:14px;line-height:1.55;margin-top:6px}
  .sub-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:34px}
  .sub-h h3{font-size:18px;font-weight:600}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:var(--panel)}
  .seg button{font:inherit;font-family:var(--font);font-size:13px;padding:6px 9px;border:0;background:none;color:var(--muted);cursor:pointer}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .seg button:focus-visible{outline:1px solid var(--ink)}
  .grid{columns:3 260px;column-gap:14px;margin-top:14px}
  .grid figure{break-inside:avoid;margin:0 0 18px}
  .ph{all:unset;display:block;width:100%;cursor:zoom-in;border-radius:2px;overflow:hidden;background:var(--line)}
  .ph img{display:block;width:100%;height:auto;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
  .ph:hover img{transform:scale(1.025)}
  .ph:focus-visible{outline:2px solid var(--trail);outline-offset:2px}
  .ph.missing{cursor:default;aspect-ratio:4/3;display:grid;place-items:center;padding:12px;text-align:center;
    background:repeating-linear-gradient(-45deg,transparent 0 7px,color-mix(in srgb,var(--line) 70%,transparent) 7px 8px);border:1px dashed var(--line);
    font-family:var(--font);font-size:12.5px;color:var(--muted)}
  figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:7px}
  figcaption b{font-size:13px;font-weight:500}
  figcaption i{font-style:normal;font-family:var(--font);font-size:12.5px;color:var(--muted);white-space:nowrap}

  #lb{border:0;padding:0;background:none;max-width:100vw;max-height:100vh;width:100vw;height:100vh;color:#f3efe6}
  #lb::backdrop{background:rgba(12,12,12,.88)}
  #lb[open]{display:grid;place-items:center}
  .lb-in{display:grid;justify-items:center;gap:10px;padding:16px}
  #lbImg{max-width:min(94vw,1400px);max-height:82vh;object-fit:contain;display:block}
  .lb-cap{font-size:14px;text-align:center}
  .lb-cap i{font-style:normal;font-family:var(--font);font-size:13px;opacity:.7;margin-left:8px}
  .lb-btn{position:fixed;font:inherit;font-family:var(--font);font-size:13px;color:#f3efe6;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);border-radius:2px;padding:8px 12px;cursor:pointer}
  .lb-btn:hover,.lb-btn:focus-visible{background:rgba(255,255,255,.18);outline:none}
  #lbClose{top:16px;right:16px}
  #lbPrev{left:16px;top:50%;transform:translateY(-50%)}
  #lbNext{right:16px;top:50%;transform:translateY(-50%)}

  .foot{margin-top:64px;padding:18px 0 30px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    font-family:var(--font);font-size:12.5px;color:var(--muted)}

  @media (max-width:640px){
    .wrap{padding:0 16px}
    .hero::after{background:color-mix(in srgb,var(--paper) 76%,transparent)}
    .hero .wrap{padding-top:36px;padding-bottom:80px}
    .hero .intro{font-size:16px}
    .sec{padding-top:56px}
    .sec-h h2{font-size:24px}
    .mapbox{height:72svh}
    .mleg .opt,.readout,.seed{display:none}
    .lbl b{font-size:13px}
    .panel{padding:22px 16px 30px}
    .md h2{font-size:23px}
    .newt{right:12px;bottom:12px}
    #lbPrev,#lbNext{top:auto;bottom:16px;transform:none}
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
  <header class="bar">
    <div class="wrap" id="bar"></div>

  <aside class="panel" id="panel" aria-hidden="true"></aside>

  <dialog id="lb" aria-label="Photo viewer">

    <button class="lb-btn" id="lbNext" aria-label="Next photo">→</button>
    <button class="lb-btn" id="lbClose" aria-label="Close">Close ✕</button>
  </dialog>

<script>
const CONFIG = window.SITE;   // edit content.js
const $ = s => document.querySelector(s);
const { mulberry32, gauss, makeNoise, hexRgb, esc, fbm } = U;   // shared helpers (common.js)

/* ================================================================
   ABOUT
   ================================================================ */
(function about(){
  U.bar($("#bar"), "about");
  $("#heroName").textContent = CONFIG.name;
  $("#intro").textContent = CONFIG.intro || "";
  document.title = `${CONFIG.name} - Portfolio`;

  const find = re => (CONFIG.links.find(l => re.test(l.label) || re.test(l.href)) || {}).href;
  const mail = find(/^mailto:|email/i), cv = find(/\bcv\b|\.pdf$/i);
  $("#cta").innerHTML =
    (mail ? `<a class="btn primary" href="${esc(mail)}">Let's get in touch</a>` : "") +
    (cv ? `<a class="btn" href="${esc(cv)}" download="${esc((CONFIG.name||"CV").replace(/\s+/g,"-"))}-CV.pdf">Download my CV ↓</a>` : "");

  const d = new Date(), ym = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  const cur = (CONFIG.itinerary || []).filter(e => e.start <= ym && (!e.end || e.end >= ym)).sort((a,b) => a.start < b.start ? 1 : -1)[0];
  if (cur){
    $("#now").innerHTML = `<div class="what"><span class="kicker">Now</span><span><b>${esc(cur.title)}</b><i>${esc(cur.short || cur.org)} · since ${U.fmtYM(cur.start)}</i></span></div>
      <a class="go" href="itinerary.html">Itinerary →</a>`;
    $("#now").hidden = false;
  }
})();

/* --- generated contour band behind the intro --------------------- */
let topoSeed = Math.floor(Math.random()*1e6);
function drawTopo(){
  const c = $("#topo"), W = c.clientWidth, H = c.clientHeight; if (!W || !H) return;
  const dpr = Math.min(2, devicePixelRatio || 1);
  c.width = Math.round(W*dpr); c.height = Math.round(H*dpr);
  const ctx = c.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  const rand = mulberry32(topoSeed), noise = makeNoise(rand);
  const cell = 5, nx = Math.ceil(W/cell)+2, ny = Math.ceil(H/cell)+2, h = new Float32Array(nx*ny);
  const S = 460, ox = rand()*100, oy = rand()*100;
  const peaks = Array.from({ length: 4 }, () => ({ x: W*(.5+.45*rand()), y: H*(.12+.76*rand()), s: 80+rand()*120, a: .4+rand()*.55 }));
  for (let j=0;j<ny;j++) for (let i=0;i<nx;i++){
    const x = i*cell, y = j*cell;
    let z = .6*fbm(noise, x/S+ox, y/S+oy, 4);
    for (const p of peaks) z += p.a*Math.exp(-((x-p.x)**2+(y-p.y)**2)/(2*p.s*p.s));
    h[j*nx+i] = z;
  }
  let lo = Infinity, hi = -Infinity; for (const v of h){ if (v<lo) lo=v; if (v>hi) hi=v; }
  for (let k=0;k<h.length;k++) h[k] = (h[k]-lo)/(hi-lo);
  const F = { h, nx, ny, cell }, cMinor = U.css("--contour"), cIndex = U.css("--contour-index");
  ctx.clearRect(0,0,W,H); ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (let n=1; n*.028<1; n++){
    const idx = n%5===0;
    ctx.beginPath(); U.traceLevel(ctx, F, n*.028);
    ctx.strokeStyle = idx ? cIndex : cMinor; ctx.globalAlpha = idx ? .85 : .5; ctx.lineWidth = idx ? 1.1 : .6; ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
let topoT, topoW = 0;
$("#newTopo").addEventListener("click", () => { topoSeed = Math.floor(Math.random()*1e6); drawTopo(); });
new ResizeObserver(() => { const w = $("#topo").clientWidth; if (Math.abs(w-topoW) < 2 && topoW) return; topoW = w; clearTimeout(topoT); topoT = setTimeout(drawTopo, 120); }).observe($("#topo"));

/* ================================================================
   PROJECTS — MAP ENGINE
   ================================================================ */
const METERS_PER_PX = 10;          // 100 px = 1 km (matches the scale bar)
const ELEV_MIN = 420, ELEV_RANGE = 3380;
const box = $("#mapbox"), canvas = $("#map"), ctx = canvas.getContext("2d");
const panel = $("#panel");
let state = null, currentSeed = null, lastFocus = null, lastW = 0, lastH = 0;
$("#projIntro").textContent = CONFIG.projectsIntro || "";

/* --- 1. density field → where summits go -----------------------
   A few "massif" centres are drawn at random; each project peak is
   sampled from a Gaussian mixture around them (rejection sampling with
   a minimum spacing). Minor unnamed peaks fill in the ranges.        */
function placeFeatures(rand, W, H, avoid){
  const S=Math.min(W,H), G=Math.sqrt(W*H), n=CONFIG.projects.length;
  const mx=56, top=56, bottom=50;
  const ok=(x,y)=> x>mx && x<W-mx && y>top && y<H-bottom &&
    !(x>avoid.left-28 && x<avoid.right+28 && y>avoid.top-28 && y<avoid.bottom+44);

  const nm=2+Math.floor(rand()*2), massifs=[];
  for(let k=0;k<nm;k++){
    let x,y,t=0;
    do{ x=W*(0.15+0.7*rand()); y=H*(0.2+0.6*rand()); t++; } while(!ok(x,y) && t<300);
    massifs.push({x,y,s:G*(0.11+0.08*rand())});
  }

  const usable=(W-2*mx)*(H-top-bottom)-(avoid.width+56)*(avoid.height+72);
  let minD=Math.min(G*0.22, Math.sqrt(Math.max(usable,1e4)/n)*0.62);
  const labelW=Math.min(230, W*0.55);   // labels are horizontal: keep summits out of each other's label band
  const peaks=[];
  CONFIG.projects.forEach((proj,i)=>{
    let d=minD, placed=false;
    for(let t=0;t<3000 && !placed;t++){
      if(t%300===299) d*=0.85;
      const m=massifs[Math.floor(rand()*nm)];
      const x=m.x+gauss(rand)*m.s, y=m.y+gauss(rand)*m.s*0.8;
      if(!ok(x,y) || peaks.some(q=>Math.hypot(q.x-x,q.y-y)<d || (Math.abs(q.y-y)<46 && Math.abs(q.x-x)<labelW))) continue;
      peaks.push({x,y,h:0.55+0.35*(proj.weight ?? 0.7)+0.06*rand(), s:S*(0.05+0.03*rand()), idx:i});
      placed=true;
    }
    if(!placed){ let x,y,t=0; do{ x=W*rand(); y=H*rand(); t++; } while(!ok(x,y) && t<500);
      peaks.push({x,y,h:0.6,s:S*0.05,idx:i}); }
  });

  const minor=[], nmin=12+Math.floor(rand()*10);
  for(let k=0;k<nmin;k++){
    const m=massifs[Math.floor(rand()*nm)], wide=rand()<0.35;
    const x= wide ? W*rand() : m.x+gauss(rand)*m.s*1.7;
    const y= wide ? H*rand() : m.y+gauss(rand)*m.s*1.3;
    if(peaks.some(q=>Math.hypot(q.x-x,q.y-y)<S*0.075)) continue;
    minor.push({x,y,h:0.1+0.22*rand(), s:S*(0.03+0.045*rand())});
  }
  const bumps=massifs.map(m=>({x:m.x,y:m.y,h:0.2,s:m.s*1.35}));
  return {peaks, minor, bumps};
}

/* --- 2. height field: noise terrain + Gaussian summits, domain-warped */
function buildField(W,H,cell,noise,feat){
  const S=Math.min(W,H);
  const nx=Math.ceil(W/cell)+2, ny=Math.ceil(H/cell)+2;
  const h=new Float32Array(nx*ny);
  const all=[...feat.peaks,...feat.minor,...feat.bumps].map(f=>({x:f.x,y:f.y,h:f.h,k:1/(2*f.s*f.s),r2:(4*f.s)**2}));
  const fb=(x,y,o)=>fbm(noise,x,y,o);
  const warp=0.07*S;
  for(let j=0;j<ny;j++){
    const py=j*cell, v=py/S;
    for(let i=0;i<nx;i++){
      const px=i*cell, u=px/S;
      const wx=px+warp*fb(u*2+5.2,v*2+1.3,3);
      const wy=py+warp*fb(u*2+9.7,v*2+4.1,3);
      const wu=wx/S, wv=wy/S;
      let z=0.16*fb(wu*2.4+31.7,wv*2.4+12.9,5);
      const r=Math.max(0,1-Math.abs(noise(wu*3.3+57.1,wv*3.3+3.7))*1.4); z+=0.07*r*r;   // ridges
      for(const f of all){ const dx=wx-f.x, dy=wy-f.y, d2=dx*dx+dy*dy; if(d2<f.r2) z+=f.h*Math.exp(-d2*f.k); }
      h[j*nx+i]=z;
    }
  }
  let lo=Infinity, hi=-Infinity;
  for(let k=0;k<h.length;k++){ if(h[k]<lo) lo=h[k]; if(h[k]>hi) hi=h[k]; }
  for(let k=0;k<h.length;k++) h[k]=(h[k]-lo)/(hi-lo);
  return {h,nx,ny,cell};
}

/* --- colours from CSS tokens ------------------------------------ */
function palette(){ const g=U.css;
  return {paper:g("--paper"),contour:g("--contour"),contourIndex:g("--contour-index"),water:g("--water"),waterLine:g("--water-line"),shadow:g("--shadow"),highlight:g("--highlight")}; }

/* --- 3. relief shading + lakes ---------------------------------- */
function drawRelief(F,wl,C){
  const {h,nx,ny,cell}=F;
  const off=document.createElement("canvas"); off.width=nx; off.height=ny;
  const o=off.getContext("2d"), img=o.createImageData(nx,ny), d=img.data;
  const P=hexRgb(C.paper), Sh=hexRgb(C.shadow), Hi=hexRgb(C.highlight), Wt=hexRgb(C.water);
  const zs=ELEV_RANGE/(METERS_PER_PX*cell*2)*1.6;            // vertical exaggeration
  const Ln=Math.hypot(1,1,1.4), flat=1.4/Ln;                  // light from the north-west
  for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){
    const k=j*nx+i, z=h[k]; let r,g,b;
    if(z<wl){ [r,g,b]=Wt; }
    else{
      const dzdx=(h[j*nx+Math.min(nx-1,i+1)]-h[j*nx+Math.max(0,i-1)])*zs;
      const dzdy=(h[Math.min(ny-1,j+1)*nx+i]-h[Math.max(0,j-1)*nx+i])*zs;
      const dot=(dzdx+dzdy+1.4)/(Math.hypot(dzdx,dzdy,1)*Ln), del=dot-flat;
      const T= del<0 ? Sh : Hi, a= del<0 ? Math.min(0.3,-del*0.75) : Math.min(0.35,del*0.7);
      r=P[0]+(T[0]-P[0])*a; g=P[1]+(T[1]-P[1])*a; b=P[2]+(T[2]-P[2])*a;
    }
    d[k*4]=r; d[k*4+1]=g; d[k*4+2]=b; d[k*4+3]=255;
  }
  o.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high";
  ctx.drawImage(off,-cell/2,-cell/2,nx*cell,ny*cell);
}

/* --- 4. contour lines (marching squares) ------------------------ */
function drawContours(F,wl,C){
  const step=0.022;
  ctx.lineCap="round"; ctx.lineJoin="round";
  for(let n=1;n*step<1;n++){
    const L=n*step; if(L<=wl) continue;
    const idx=n%5===0;
    ctx.beginPath(); U.traceLevel(ctx,F,L);
    ctx.strokeStyle=idx?C.contourIndex:C.contour; ctx.globalAlpha=idx?0.9:0.55; ctx.lineWidth=idx?1.1:0.55;
    ctx.stroke();
  }
  ctx.beginPath(); U.traceLevel(ctx,F,wl);
  ctx.strokeStyle=C.waterLine; ctx.globalAlpha=0.9; ctx.lineWidth=1; ctx.stroke();
  ctx.globalAlpha=1;
}

/* --- 5. summits, labels, trail ---------------------------------- */
const pdate = i => { const p=CONFIG.projects[i]; return p.date || String(p.year||""); };
const elev = z => Math.round(ELEV_MIN+z*ELEV_RANGE);

function climb(F,x,y){
  const {h,nx,ny,cell}=F;
  let i=Math.min(nx-1,Math.max(0,Math.round(x/cell))), j=Math.min(ny-1,Math.max(0,Math.round(y/cell)));
  for(let t=0;t<600;t++){
    let bi=i,bj=j,bz=h[j*nx+i];
    for(let dj=-1;dj<=1;dj++) for(let di=-1;di<=1;di++){
      const ii=i+di, jj=j+dj;
      if(ii<0||jj<0||ii>=nx||jj>=ny) continue;
      if(h[jj*nx+ii]>bz){ bz=h[jj*nx+ii]; bi=ii; bj=jj; }
    }
    if(bi===i&&bj===j) break; i=bi; j=bj;
  }
  return {x:i*cell,y:j*cell,z:h[j*nx+i]};
}

function placeMarkers(W){
  const pk=$("#peaks"); pk.innerHTML="";
  const F=state.field;
  const markers=state.feat.peaks.map(p=>{ const m=climb(F,p.x,p.y); return {...m, idx:p.idx, elev:elev(m.z)}; });
  markers.sort((a,b)=>a.idx-b.idx);
  state.order=markers.map(m=>m.idx).sort((a,b)=>pdate(a).localeCompare(pdate(b))||((CONFIG.projects[a].weight??.7)-(CONFIG.projects[b].weight??.7))||(a-b));   // chronological trail order
  const rects=[];
  const lblRect=(m,flip)=>{ const w=Math.max((CONFIG.projects[m.idx].short||CONFIG.projects[m.idx].title).length*7.8, 70)+20;
    return flip ? {l:m.x-w-19,r:m.x-12,t:m.y-14,b:m.y+22} : {l:m.x+12,r:m.x+w+19,t:m.y-14,b:m.y+22}; };
  const hit=(r)=>rects.some(q=>!(r.r<q.l||r.l>q.r||r.b<q.t||r.t>q.b));
  markers.forEach(m=>{
    const p=CONFIG.projects[m.idx];
    const lw=lblRect(m,false).r-m.x, fitsR=m.x+lw<W-8, fitsL=m.x-lw>8;   // never let a label run off the map
    let flip=!fitsR || m.x>W-210, r=lblRect(m,flip);
    if(hit(r)){ const r2=lblRect(m,!flip); if(!hit(r2) && (flip ? fitsR : fitsL)){ flip=!flip; r=r2; } }
    rects.push(r);
    const btn=document.createElement("button");
    btn.className="peak"+(flip?" flip":"")+(p.status==="in-progress"?" wip":""); btn.setAttribute("role","listitem");
    btn.style.left=m.x+"px"; btn.style.top=m.y+"px";
    btn.style.setProperty("--d",(0.35+state.order.indexOf(m.idx)*0.09)+"s");
    btn.setAttribute("aria-label",p.title);
    btn.innerHTML=`<svg viewBox="0 0 14 12" aria-hidden="true"><path d="M7 0L14 12H0Z"/></svg><span class="lbl"><b>${esc(p.short||p.title)}</b><i>${m.elev} m${p.status==="in-progress"?" · in progress":""}</i></span>`;
    btn.addEventListener("click",e=>{ e.stopPropagation(); openProject(m.idx); });
    m.el=btn; pk.appendChild(btn);
  });
  state.markers=markers;

  // Catmull-Rom → cubic Bézier through the summits in chronological order
  const pts=state.order.map(i=>markers[i]);
  let d=pts.length?`M${pts[0].x},${pts[0].y}`:"";
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    d+=` C${p1.x+(p2.x-p0.x)/6},${p1.y+(p2.y-p0.y)/6} ${p2.x-(p3.x-p1.x)/6},${p2.y-(p3.y-p1.y)/6} ${p2.x},${p2.y}`;
  }
  $("#trailPath").setAttribute("d",d);
  drawArrows();
}

/* small chevrons along the trail showing its direction (oldest → newest) */
function drawArrows(){
  const svg=$("#trail"), path=$("#trailPath");
  svg.querySelectorAll(".arw").forEach(a=>a.remove());
  const L=path.getTotalLength(); if(L<60) return;
  const gap=120, n=Math.max(1,Math.floor(L/gap)), sz=4.5, NS="http://www.w3.org/2000/svg";
  for(let k=0;k<n;k++){
    const s=(k+.5)*L/n, a=path.getPointAtLength(s), b=path.getPointAtLength(Math.min(L,s+1));
    if(state.markers.some(m=>Math.hypot(m.x-a.x,m.y-a.y)<22)) continue;      // keep summits uncluttered
    const ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
    const el=document.createElementNS(NS,"path");
    el.setAttribute("class","arw");
    el.setAttribute("d",`M${-sz},${-sz} L${sz*.6},0 L${-sz},${sz}`);
    el.setAttribute("transform",`translate(${a.x.toFixed(1)},${a.y.toFixed(1)}) rotate(${ang.toFixed(1)})`);
    svg.appendChild(el);
  }
}

/* --- render ----------------------------------------------------- */
function render(seed){
  currentSeed=seed;
  const W=box.clientWidth, H=box.clientHeight, dpr=Math.min(2,devicePixelRatio||1);
  lastW=W; lastH=H;
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  $("#trail").setAttribute("viewBox",`0 0 ${W} ${H}`);

  const rand=mulberry32(seed), noise=makeNoise(rand);
  const br=box.getBoundingClientRect(), lr=$("#mleg").getBoundingClientRect();
  const avoid={ left:lr.left-br.left, right:lr.right-br.left, top:lr.top-br.top, bottom:lr.bottom-br.top, width:lr.width, height:lr.height };
  const feat=placeFeatures(rand,W,H,avoid);
  const cell= W*H>1.2e6 ? 5 : 4;
  const field=buildField(W,H,cell,noise,feat);

  const sample=[]; for(let k=0;k<field.h.length;k+=7) sample.push(field.h[k]);
  sample.sort((a,b)=>a-b);
  const wl= rand()<0.8 ? sample[Math.floor(sample.length*(0.02+0.05*rand()))] : -1;

  // Swiss LV95-style grid origin, derived from the seed
  const E0=2480000+Math.floor(rand()*300)*1000, N0=1280000-Math.floor(rand()*150)*1000;
  state={seed,field,feat,wl,E0,N0,markers:[],order:[]};

  const C=palette();
  ctx.fillStyle=C.paper; ctx.fillRect(0,0,W,H);
  drawRelief(field,wl,C);
  drawContours(field,wl,C);
  placeMarkers(W);

  $("#seedLabel").textContent=`sheet № ${String(seed).padStart(6,"0")}`;
  history.replaceState(null,"",`${location.pathname}?s=${seed}${location.hash}`);
  requestAnimationFrame(()=>{ canvas.classList.add("on"); $("#trail").classList.add("on"); });
}
function regenerate(seed){
  closePanel();
  canvas.classList.remove("on"); $("#trail").classList.remove("on");
  $("#peaks").innerHTML="";
  setTimeout(()=>render(seed), matchMedia("(prefers-reduced-motion: reduce)").matches?0:350);
}

/* --- project panel ---------------------------------------------- */
function openPanel(html){
  lastFocus=lastFocus||document.activeElement;
  panel.innerHTML=html; panel.classList.add("open"); panel.setAttribute("aria-hidden","false");
  panel.scrollTop=0;
  panel.querySelector(".close").addEventListener("click",closePanel);
  panel.querySelector(".close").focus({preventScroll:true});
}
function closePanel(){
  if(!panel.classList.contains("open")) return;
  panel.classList.remove("open"); panel.setAttribute("aria-hidden","true");
  state?.markers.forEach(m=>m.el.classList.remove("active"));
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus({preventScroll:true});
  lastFocus=null;
}
function openProject(i){
  if(!state) return;
  const p=CONFIG.projects[i];
  state.markers.forEach(x=>x.el.classList.toggle("active",x.idx===i));
  const fig=f=>`<figure><img src="${esc(f.img)}" alt="${esc(f.alt||f.caption||"")}" loading="lazy" decoding="async">${f.caption?`<figcaption>${esc(f.caption)}</figcaption>`:""}</figure>`;
  const media=p.media||[], at=w=>media.filter(m=>(m.after||"work")===w).map(fig).join("");
  const paras=x=>(Array.isArray(x)?x:[x]).filter(Boolean).map(t=>`<p>${esc(t)}</p>`).join("");
  const links=(p.links||[]).map(l=>`<a class="btn" href="${esc(l.href)}" target="_blank" rel="noopener">${/github\.com/.test(l.href)?'<i class="fa-brands fa-github"></i> ':""}${esc(l.label)}</a>`).join("");
  openPanel(`
    <button class="btn close" aria-label="Close">✕</button>
    <article class="md">
      <h2>${esc(p.title)}</h2>
      ${p.context?`<div class="meta">${esc(p.context)}</div>`:""}
      ${p.goal?`<h3>Objective</h3>${paras(p.goal)}`:""}${at("goal")}
      ${p.work?`<h3>${esc(p.workTitle||"Approach and results")}</h3>${paras(p.work)}`:""}${at("work")}
      ${p.contribution?`<h3>My role</h3>${paras(p.contribution)}`:""}
      ${links?`<div class="repo"><p>The code and write-up are on GitHub.</p><div>${links}</div></div>`:""}
    </article>`);
  panel.querySelectorAll(".md figure img").forEach(img=>img.addEventListener("click",()=>{ $("#lbImg").src=img.src; $("#lbImg").alt=img.alt; $("#lbCap").textContent=img.alt; $("#lbPrev").hidden=$("#lbNext").hidden=true; $("#lb").showModal(); }));
}





/* --- cursor readout: coordinates + altitude --------------------- */
const fmt=n=>n.toLocaleString("de-CH");
canvas.addEventListener("mousemove",e=>{
  if(!state) return;
  const {h,nx,ny,cell}=state.field;
  const i=Math.min(nx-1,Math.round(e.offsetX/cell)), j=Math.min(ny-1,Math.round(e.offsetY/cell));
  const z=h[j*nx+i];
  const E=state.E0+Math.round(e.offsetX*METERS_PER_PX), N=state.N0-Math.round(e.offsetY*METERS_PER_PX);
  $("#readout").textContent= z<state.wl ? `E ${fmt(E)} · N ${fmt(N)} · lake` : `E ${fmt(E)} · N ${fmt(N)} · ${elev(z)} m`;
});
canvas.addEventListener("mouseleave",()=>{ $("#readout").textContent=""; });
canvas.addEventListener("click",closePanel);
$("#newBtn").addEventListener("click",()=>regenerate(Math.floor(Math.random()*1e6)));
addEventListener("keydown",e=>{ if(e.key==="Escape") closePanel(); });

let mapT;
new ResizeObserver(()=>{
  if(currentSeed===null) return;
  const w=box.clientWidth, h=box.clientHeight;
  if(Math.abs(w-lastW)<2 && Math.abs(h-lastH)<40) return;     // ignore small height changes (mobile URL bar)
  clearTimeout(mapT); mapT=setTimeout(()=>render(currentSeed),180);
}).observe(box);
U.onTheme(()=>{ drawTopo(); if(currentSeed!==null) render(currentSeed); });

const seedFromURL=()=>{ const m=location.search.match(/[?&]s=(\d+)/); return m ? +m[1] : null; };
(document.fonts?.ready ?? Promise.resolve()).then(()=>render(seedFromURL() ?? Math.floor(Math.random()*1e6)));

/* ================================================================
   OUTSIDE — interests + photos
   ================================================================ */
const O = CONFIG.outside || {};
if (O.title) $("#h-out").textContent = O.title;
$("#outIntro").textContent = O.intro || "";
$("#credit").textContent = `© ${new Date().getFullYear()} ${CONFIG.name}`;
$("#ints").innerHTML = (O.interests || []).map(it => `
  <article class="int">
    ${it.image ? `<img src="${esc(it.image)}" alt="" loading="lazy" decoding="async">` : ""}
    <h3>${esc(it.name)}</h3>
    <p>${esc(it.text || "")}</p>
  </article>`).join("");

const photos = O.photos || [];
let filter = "all", visible = [], cur = 0;
const cats = [...new Set(photos.map(p => p.category).filter(Boolean))];
if (!photos.length) $("#photoSec").hidden = true;
if (cats.length > 1){
  $("#filters").innerHTML = ["all", ...cats].map(c => `<button data-c="${esc(c)}">${c === "all" ? "All" : esc(c[0].toUpperCase() + c.slice(1))}</button>`).join("");
  $("#filters").addEventListener("click", e => { const b = e.target.closest("button"); if (b){ filter = b.dataset.c; renderPhotos(); } });
} else $("#filters").hidden = true;

function markMissing(img){
  const b = img.parentElement; b.classList.add("missing"); b.disabled = true;
  b.innerHTML = `<span>photo not found<br>${esc(img.getAttribute("src"))}</span>`;
}
function renderPhotos(){
  const list = photos.map((p, i) => ({ p, i })).filter(x => filter === "all" || x.p.category === filter);
  visible = list.map(x => x.i);
  $("#grid").innerHTML = list.map(({ p, i }) => `
    <figure>
      <button class="ph" data-i="${i}" aria-label="Open photo${p.title ? ": " + esc(p.title) : ""}">
        <img src="${esc(p.src)}" alt="${esc(p.alt || p.title || "")}" loading="lazy" decoding="async">
      </button>
      ${p.title || p.place || p.year ? `<figcaption><b>${esc(p.title || "")}</b><i>${esc([p.place, p.year].filter(Boolean).join(" · "))}</i></figcaption>` : ""}
    </figure>`).join("");
  $("#grid").querySelectorAll("img").forEach(img => {
    if (img.complete && !img.naturalWidth) markMissing(img);
    else img.addEventListener("error", () => markMissing(img), { once: true });
  });
  document.querySelectorAll("#filters button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.c === filter)));
}
renderPhotos();

const lb = $("#lb");
function show(k){
  cur = (k + visible.length) % visible.length;
  const p = photos[visible[cur]];
  $("#lbImg").src = p.src; $("#lbImg").alt = p.alt || p.title || "";
  $("#lbCap").innerHTML = `${esc(p.title || "")}<i>${esc([p.place, p.year].filter(Boolean).join(" · "))}</i>`;
  const multi = visible.length > 1; $("#lbPrev").hidden = !multi; $("#lbNext").hidden = !multi;
}
$("#grid").addEventListener("click", e => {
  const b = e.target.closest(".ph"); if (!b || b.classList.contains("missing")) return;
  show(visible.indexOf(+b.dataset.i)); lb.showModal();
});
$("#lbPrev").addEventListener("click", () => show(cur - 1));
$("#lbNext").addEventListener("click", () => show(cur + 1));
$("#lbClose").addEventListener("click", () => lb.close());
lb.addEventListener("click", e => { if (e.target === lb || e.target.classList.contains("lb-in")) lb.close(); });
lb.addEventListener("keydown", e => { if (e.key === "ArrowLeft") show(cur - 1); if (e.key === "ArrowRight") show(cur + 1); });
</script>
